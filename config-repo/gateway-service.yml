server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: cliente-service
          uri: lb://CLIENTE-SERVICE
          predicates:
            - Path=/api/clientes/**
        - id: categoria-service
          uri: lb://CATEGORIA-SERVICE
          predicates:
            - Path=/api/categorias/**
        - id: pedido-service
          uri: lb://PEDIDO-SERVICE
          predicates:
            - Path=/api/pedidos/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: gateway-service
    description: Gateway de laboratorio 15 para observabilidad.
